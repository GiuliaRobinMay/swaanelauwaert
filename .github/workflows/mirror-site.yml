name: Mirror source site

on:
  workflow_dispatch:
    inputs:
      site:
        description: Origin of the site to mirror (no trailing slash)
        required: true
        default: https://swaanelauwaert.com
      max_screenshots:
        description: Maximum number of pages to screenshot
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install crawl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wget jq curl

      - name: Crawl site (REST API, sitemap, wget mirror, media)
        run: bash scripts/mirror/crawl.sh "${{ inputs.site }}"

      - name: Install Playwright
        working-directory: scripts/mirror
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Screenshots and page extraction
        working-directory: scripts/mirror
        env:
          SITE: ${{ inputs.site }}
          MAX_SCREENSHOTS: ${{ inputs.max_screenshots }}
        run: node screenshots.mjs

      - name: Summarize
        run: bash scripts/mirror/summarize.sh

      - name: Commit mirror to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mirror
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore(mirror): snapshot of ${{ inputs.site }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
