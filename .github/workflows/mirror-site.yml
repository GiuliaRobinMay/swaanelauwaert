name: Mirror source site

on:
  workflow_dispatch:
    inputs:
      site:
        description: Origin of the site to mirror (no trailing slash)
        required: true
        default: https://swaanelauwaert.com
      run_crawl:
        description: Run the REST/wget crawl
        type: boolean
        default: true
      run_fetch_list:
        description: Download mirror/meta/fetch-list.txt (paced)
        type: boolean
        default: false
      run_screenshots:
        description: Run the paced Playwright capture
        type: boolean
        default: true
      run_rest_extra:
        description: Dump extra REST collections (comments, menus)
        type: boolean
        default: false
      delay_ms:
        description: Delay between page loads in the capture
        default: "5000"
      max_posts:
        description: Number of blog posts to include in the capture
        default: "16"

permissions:
  contents: write

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install crawl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wget jq curl

      - name: Crawl site (REST API, sitemap, wget mirror, media)
        if: ${{ inputs.run_crawl }}
        run: bash scripts/mirror/crawl.sh "${{ inputs.site }}"

      - name: Extra REST collections
        if: ${{ inputs.run_rest_extra }}
        run: bash scripts/mirror/rest-extra.sh "${{ inputs.site }}"

      - name: Install capture tools
        working-directory: scripts/mirror
        run: |
          npm install --no-audit --no-fund
          if [ "${{ inputs.run_screenshots }}" = "true" ]; then npx playwright install --with-deps chromium; fi

      - name: Download missing media from fetch list (paced)
        if: ${{ inputs.run_fetch_list }}
        run: |
          bash scripts/mirror/fetch-list.sh mirror/meta/fetch-list.txt
          (cd scripts/mirror && node shrink.mjs ../../mirror/media 2000)

      - name: Commit interim results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mirror
          git diff --cached --quiet || (git commit -m "chore(mirror): crawl/media update for ${{ inputs.site }}" && git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }})

      - name: Paced screenshots and page extraction
        if: ${{ inputs.run_screenshots }}
        working-directory: scripts/mirror
        env:
          SITE: ${{ inputs.site }}
          DELAY_MS: ${{ inputs.delay_ms }}
          MAX_POSTS: ${{ inputs.max_posts }}
        run: node screenshots.mjs

      - name: Summarize
        run: bash scripts/mirror/summarize.sh

      - name: Commit mirror to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mirror
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore(mirror): capture update for ${{ inputs.site }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
